name: Deploy Mobile PRODUCTION

# Publishes the JavaScript on `main` as an over-the-air update to the
# `production` channel — the store builds. Members get it on their next launch.
# A native change needs a store build first (build.yml); the fingerprint
# runtime version keeps this update away from binaries it does not fit.
# See docs/RELEASING.md.
on:
  push:
    branches:
      - main

concurrency:
  group: eas-update-production
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update (production)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.eas.outputs.ready }}

    steps:
      - name: Check EAS credentials
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set — skipping the EAS update. See docs/ENVIRONMENTS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.eas.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.eas.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS
        if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: npm ci

      # The same values as the `production` build profile in eas.json.
      - name: Publish update
        if: steps.eas.outputs.ready == 'true'
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://service.bloomboard.pro/api
          EXPO_PUBLIC_WS_URL: https://service.bloomboard.pro
        run: |
          eas update --channel production --platform all --non-interactive \
            --message "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"

  # ─── Release tag ────────────────────────────────────────────────────────────
  # Records what reached production, as in the other repos. Nothing is gated on
  # it. Only fires when an update was actually published and package.json
  # carries a version not tagged yet.
  tag:
    name: Tag release
    needs: update
    if: needs.update.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag if package.json carries a new version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already tagged — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Tagged $VERSION at $(git rev-parse --short HEAD)"
