name: Deploy Mobile PRODUCTION

# Every push to `main` builds the Android app against the production API and
# submits it to Google Play's **production** track, then tags v<version>.
# Google reviews each release before members get it (hours to a few days).
#
# The build runs on EAS's machines; this job queues it and returns. EAS submits
# when the build finishes, with the Play service account key stored in EAS
# (docs/ENVIRONMENTS.md). Releases are created as drafts until the app's first
# release is published — see `releaseStatus` in eas.json.
on:
  push:
    branches:
      - main

concurrency:
  group: eas-build-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit (production)
    runs-on: ubuntu-latest
    outputs:
      queued: ${{ steps.eas.outputs.ready }}

    steps:
      - name: Check EAS credentials
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set — skipping the build. See docs/ENVIRONMENTS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.eas.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.eas.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS
        if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: npm ci

      - name: Build and submit
        if: steps.eas.outputs.ready == 'true'
        run: |
          eas build --profile production --platform android --non-interactive --no-wait \
            --auto-submit-with-profile production \
            --message "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"

  # ─── Release tag ────────────────────────────────────────────────────────────
  # Records what was sent to production, as in the other repos. Nothing is gated
  # on it. Only fires when a build was queued and package.json carries a version
  # not tagged yet.
  tag:
    name: Tag release
    needs: build
    if: needs.build.outputs.queued == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag if package.json carries a new version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already tagged — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Tagged $VERSION at $(git rev-parse --short HEAD)"
