name: Deploy Mobile BETA

# Publishes the JavaScript on `beta` as an over-the-air update to the `beta`
# channel — the one `preview` builds (internal testers, beta API) listen to.
# Native changes need a new build instead (build.yml); the fingerprint runtime
# version keeps an update from ever reaching a binary it does not fit.
# See docs/RELEASING.md.
on:
  push:
    branches:
      - beta

concurrency:
  group: eas-update-beta
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update (beta)
    runs-on: ubuntu-latest

    steps:
      # Until the EAS project is linked and EXPO_TOKEN exists (docs/
      # ENVIRONMENTS.md, one-off setup) there is nothing to publish to: skip
      # with a notice rather than fail every promotion.
      - name: Check EAS credentials
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set — skipping the EAS update. See docs/ENVIRONMENTS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.eas.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.eas.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS
        if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: npm ci

      # The same values as the `preview` build profile in eas.json: an update
      # is compiled here, not on EAS, so it does not read the profile's env.
      - name: Publish update
        if: steps.eas.outputs.ready == 'true'
        env:
          APP_ENV: preview
          EXPO_PUBLIC_API_URL: https://beta.service.bloomboard.pro/api
          EXPO_PUBLIC_WS_URL: https://beta.service.bloomboard.pro
        run: |
          eas update --channel beta --platform all --non-interactive \
            --message "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"
