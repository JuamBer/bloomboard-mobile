name: Deploy Mobile BETA

# Every push to `beta` builds the Android app against the beta API and submits
# it to Google Play's **internal testing** track — the team installs it from
# the Play Store (opt-in link). Same listing as production
# (`pro.bloomboard.app`), shown as "Bloom Board (beta)".
#
# The build runs on EAS's machines; this job queues it and returns. EAS submits
# when the build finishes, with the Play service account key stored in EAS
# (docs/ENVIRONMENTS.md). Track releases are created as drafts until the app's
# first release is published — see `releaseStatus` in eas.json.
on:
  push:
    branches:
      - beta

concurrency:
  group: eas-build-beta
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit (internal testing)
    runs-on: ubuntu-latest

    steps:
      # Until the EAS project is linked and EXPO_TOKEN exists (docs/
      # ENVIRONMENTS.md) there is nothing to build with: skip with a notice
      # rather than fail every promotion.
      - name: Check EAS credentials
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set — skipping the build. See docs/ENVIRONMENTS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.eas.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.eas.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS
        if: steps.eas.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: npm ci

      - name: Build and submit
        if: steps.eas.outputs.ready == 'true'
        run: |
          eas build --profile beta --platform android --non-interactive --no-wait \
            --auto-submit-with-profile beta \
            --message "$(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))"
